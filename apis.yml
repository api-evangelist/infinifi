aid: infinifi
name: Infinifi
description: >-
  infiniFi (InfiniFi Labs) is a DeFi protocol that amplifies returns on existing
  DeFi yield platforms — Pendle, Ethena, AAVE, and others it calls "farms" — by
  applying fractional-reserve banking principles on-chain. Users deposit USDC to
  mint iUSD (a receipt token), then stake it for siUSD (liquid yield) or lock it
  for liUSD (illiquid yield plus governance). liUSD holders govern capital
  allocation across liquid, maturity, and protocol farms through allocation
  voting weighted by locked amount and unwinding period. The protocol is a set of
  timelock-governed, audited Solidity smart contracts (Core, Gateway, Funding,
  Locking, YieldSharing, FarmRegistry) on Ethereum, backed by Electric Capital.
